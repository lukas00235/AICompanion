<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Assistant</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 320px;
            height: 600px;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background: white;
            overflow: hidden;
        }
        
        #root {
            width: 100%;
            height: 100%;
        }

        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: #f5f5f5;
        }

        .loading::after {
            content: "Načítání...";
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading"></div>
    </div>
    
    <script>
        // This popup will load the React app from the web server
        // when the extension is in development mode, or serve static files in production
        
        // Check if we're in development (localhost server available)
        fetch('http://localhost:5000')
            .then(response => {
                if (response.ok) {
                    // Development mode - load from Vite server
                    window.location.href = 'http://localhost:5000';
                } else {
                    throw new Error('Development server not available');
                }
            })
            .catch(() => {
                // Production mode - show static popup
                document.getElementById('root').innerHTML = `
                    <div style="padding: 16px; text-align: center;">
                        <h3>AI Text Assistant</h3>
                        <p>Pro použití tohoto rozšíření spusťte backend server.</p>
                        <p style="font-size: 12px; color: #666;">
                            Návod najdete v dokumentaci rozšíření.
                        </p>
                    </div>
                `;
            });
    </script>
</body>
</html>
